<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تطبيق الأول متوسط 3D الفائق</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-deep: #050508;
            --card-glass: rgba(18, 18, 28, 0.7);
            --neon-blue: #38bdf8;
            --neon-purple: #c084fc;
            --text-main: #ffffff;
            --text-sub: #94a3b8;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow-x: hidden !important;
            background: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Cairo', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            box-sizing: border-box;
            -webkit-user-select: none !important;
            user-select: none !important;
            -webkit-touch-callout: none !important;
            -webkit-tap-highlight-color: transparent;
        }

        *, *:before, *:after {
            box-sizing: border-box;
            -webkit-user-select: none !important;
            user-select: none !important;
        }

        .particles-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(56, 189, 248, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(192, 132, 252, 0.15) 0%, transparent 40%);
            z-index: -1;
            pointer-events: none;
            animation: bgPulse 8s infinite alternate ease-in-out;
        }

        @keyframes bgPulse {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.1); opacity: 1; }
        }

        .container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            padding: 20px 16px;
        }

        .hero-3d {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
            perspective: 1200px;
        }

        .book-wrapper {
            width: 110px;
            height: 130px;
            position: relative;
            transform-style: preserve-3d;
            margin-bottom: 15px;
        }

        .book-3d {
            width: 100%;
            height: 100%;
            position: absolute;
            transform-style: preserve-3d;
            animation: superBookMotion 5s infinite ease-in-out;
        }

        @keyframes superBookMotion {
            0% { transform: rotateX(15deg) rotateY(-25deg) translateY(0px); }
            25% { transform: rotateX(25deg) rotateY(15deg) translateY(-8px); }
            50% { transform: rotateX(10deg) rotateY(45deg) translateY(0px); }
            75% { transform: rotateX(20deg) rotateY(-15deg) translateY(-5px); }
            100% { transform: rotateX(15deg) rotateY(-25deg) translateY(0px); }
        }

        .book-back {
            position: absolute;
            width: 100%;
            height: 100%;
            background: #cbd5e1;
            border-radius: 4px 10px 10px 4px;
            box-shadow: 0 15px 30px rgba(56, 189, 248, 0.3);
        }

        .page {
            position: absolute;
            width: 92%;
            height: 94%;
            top: 3%;
            right: 4%;
            background: #ffffff;
            border-radius: 2px 6px 6px 2px;
            transform-origin: right center;
            box-shadow: inset 3px 0 6px rgba(0,0,0,0.15);
        }

        .page-1 { animation: flipPage1 5s infinite ease-in-out; }
        .page-2 { animation: flipPage2 5s infinite ease-in-out 0.4s; }

        .book-cover {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #ffffff 0%, #e2e8f0 100%);
            border: 2px solid var(--neon-blue);
            border-radius: 4px 10px 10px 4px;
            transform-origin: right center;
            animation: openCover 5s infinite ease-in-out;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.5);
        }

        @keyframes openCover {
            0%, 100% { transform: rotateY(0deg); }
            35%, 65% { transform: rotateY(-150deg); }
        }

        @keyframes flipPage1 {
            0%, 100% { transform: rotateY(0deg); }
            40%, 60% { transform: rotateY(-135deg); }
        }

        @keyframes flipPage2 {
            0%, 100% { transform: rotateY(0deg); }
            45%, 55% { transform: rotateY(-120deg); }
        }

        .title {
            font-size: 26px;
            font-weight: 900;
            margin: 0;
            background: linear-gradient(135deg, #ffffff 0%, var(--neon-blue) 50%, var(--neon-purple) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            filter: drop-shadow(0 2px 10px rgba(56,189,248,0.3));
        }

        .tabs {
            display: flex;
            gap: 10px;
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 18px;
            padding: 6px;
            margin: 22px 0;
            backdrop-filter: blur(15px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 14px;
            background: transparent;
            color: var(--text-sub);
            font-size: 15px;
            font-weight: 700;
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #0284c7, #9333ea);
            color: #ffffff;
            box-shadow: 0 8px 25px rgba(147, 51, 234, 0.5);
        }

        .cards-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
            perspective: 1000px;
        }

        .card {
            position: relative;
            background: var(--card-glass);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 16px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(16px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            transform-style: preserve-3d;
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), border-color 0.3s ease;
            cursor: pointer;
            gap: 10px;
        }

        .card.clicked-3d {
            transform: scale(0.94) rotateX(15deg) rotateY(-5deg) translateZ(20px) !important;
            border-color: var(--neon-blue);
            box-shadow: 0 5px 25px rgba(56, 189, 248, 0.6);
        }

        .card::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 20px;
            background: linear-gradient(45deg, var(--neon-blue), transparent, var(--neon-purple));
            z-index: -1;
            opacity: 0.3;
            transition: opacity 0.3s;
        }

        .card-info {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .icon-box-3d {
            width: 40px;
            height: 40px;
            perspective: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .mini-book-3d {
            width: 26px;
            height: 32px;
            position: relative;
            transform-style: preserve-3d;
            animation: miniFloat 4s infinite ease-in-out;
        }

        .mini-cover {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-purple));
            border-radius: 2px 5px 5px 2px;
            transform-origin: right center;
            animation: miniOpen 4s infinite ease-in-out;
            box-shadow: 0 5px 15px rgba(56, 189, 248, 0.5);
        }

        .mini-page {
            position: absolute;
            width: 90%;
            height: 90%;
            top: 5%;
            right: 5%;
            background: #ffffff;
            border-radius: 1px 4px 4px 1px;
        }

        @keyframes miniFloat {
            0%, 100% { transform: translateY(0) rotateY(-15deg) rotateX(10deg); }
            50% { transform: translateY(-4px) rotateY(15deg) rotateX(-10deg); }
        }

        @keyframes miniOpen {
            0%, 100% { transform: rotateY(0deg); }
            50% { transform: rotateY(-120deg); }
        }

        .card-title {
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .action-text {
            font-size: 12px;
            font-weight: 700;
            color: var(--neon-blue);
            background: rgba(56, 189, 248, 0.1);
            padding: 6px 10px;
            border-radius: 10px;
            border: 1px solid rgba(56, 189, 248, 0.3);
            white-space: nowrap;
            flex-shrink: 0;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 8, 0.85);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            width: 92%;
            max-width: 380px;
            background: rgba(18, 18, 30, 0.95);
            border: 1px solid rgba(192, 132, 252, 0.3);
            border-radius: 26px;
            padding: 24px 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9),
                        0 0 30px rgba(192, 132, 252, 0.15);
            transform: scale(0.85) translateY(20px);
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .modal-overlay.active .modal-card {
            transform: scale(1) translateY(0);
        }

        .modal-title {
            font-size: 18px;
            font-weight: 900;
            margin-bottom: 20px;
            color: #ffffff;
            text-align: center;
            background: linear-gradient(135deg, #ffffff 30%, var(--neon-purple) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.3px;
        }

        .teachers-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 260px;
            overflow-y: auto;
            padding-left: 2px;
        }

        .teacher-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #ffffff;
            padding: 14px 18px;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 700;
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .teacher-btn:active {
            transform: scale(0.97) translateY(2px);
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(192, 132, 252, 0.2));
            border-color: var(--neon-purple);
            box-shadow: 0 0 20px rgba(192, 132, 252, 0.4);
        }

        .teacher-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .teacher-icon-glow {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--neon-blue);
        }

        .arrow-icon {
            color: var(--text-sub);
            transition: transform 0.2s ease, color 0.2s ease;
        }

        .teacher-btn:active .arrow-icon {
            transform: translateX(-4px);
            color: #ffffff;
        }

        .modal-close {
            margin-top: 18px;
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--text-sub);
            padding: 12px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 14px;
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .modal-close:active {
            background: rgba(239, 68, 68, 0.15);
            border-color: rgba(239, 68, 68, 0.4);
            color: #ef4444;
        }

        .toast-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 8, 0.75);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .toast-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .toast-box {
            background: linear-gradient(135deg, rgba(18, 18, 28, 0.95), rgba(15, 23, 42, 0.95));
            border: 1px solid var(--neon-blue);
            padding: 24px 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(56, 189, 248, 0.3);
            transform: scale(0.8);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .toast-overlay.active .toast-box {
            transform: scale(1);
        }

        .toast-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(56, 189, 248, 0.2);
            border-top-color: var(--neon-blue);
            border-radius: 50%;
            margin: 0 auto 15px auto;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .toast-text {
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            margin: 0;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            font-size: 12px;
            color: var(--text-sub);
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="particles-bg"></div>

    <div class="container">
        <div class="hero-3d">
            <div class="book-wrapper">
                <div class="book-3d">
                    <div class="book-back"></div>
                    <div class="page page-2"></div>
                    <div class="page page-1"></div>
                    <div class="book-cover"></div>
                </div>
            </div>
            <h1 class="title">تطبيق الأول متوسط</h1>
        </div>

        <div class="tabs">
            <button id="btn-books" class="tab-btn active" onclick="switchTab('books')">الكتب المدرسية</button>
            <button id="btn-notes" class="tab-btn" onclick="switchTab('notes')">الملازم التعليمية</button>
        </div>

        <div id="subject-list" class="cards-grid"></div>

        <div class="footer">
            البوت الرسمي: @jjswkkskdnobot
        </div>
    </div>

    <div id="teachersModal" class="modal-overlay" onclick="closeModal(event)">
        <div class="modal-card">
            <div class="modal-title" id="modalSubTitle">اختر الأستاذ / الست</div>
            <div class="teachers-list" id="teachersContainer"></div>
            <button class="modal-close" onclick="closeModalForce()">إلغاء</button>
        </div>
    </div>

    <div id="redirectToast" class="toast-overlay">
        <div class="toast-box">
            <div class="toast-spinner"></div>
            <p class="toast-text">جاري نقلك إلى البوت...</p>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        document.addEventListener('contextmenu', event => event.preventDefault());

        const subjects = {
            "s0": "القرآن الكريم والإسلامية",
            "s1": "اللغة العربية",
            "s2": "اللغة الإنكليزية",
            "s3": "الرياضيات",
            "s4": "الاجتماعيات",
            "s5": "علم الأحياء",
            "s6": "الكيمياء",
            "s7": "الفيزياء",
            "s8": "الحاسوب",
            "s9": "الأخلاقية"
        };

        let dynamicData = {
            books: {},
            notes: {}
        };

        let currentTab = 'books';

        async function fetchDynamicData() {
            try {
                const response = await fetch('database.json');
                if (response.ok) {
                    dynamicData = await response.json();
                }
            } catch (e) {
                console.log("العمل بالوضع الافتراضي");
            }
            renderSubjects();
        }

        function renderSubjects() {
            const container = document.getElementById('subject-list');
            container.innerHTML = '';

            Object.keys(subjects).forEach(sub_id => {
                const card = document.createElement('div');
                card.className = 'card';

                const labelText = currentTab === 'books' ? 'تحميل الكتاب' : 'اختر الأستاذ';

                card.innerHTML = `
                    <div class="card-info">
                        <div class="icon-box-3d">
                            <div class="mini-book-3d">
                                <div class="mini-page"></div>
                                <div class="mini-cover"></div>
                            </div>
                        </div>
                        <div class="card-title">${subjects[sub_id]}</div>
                    </div>
                    <div class="action-text">${labelText}</div>
                `;

                card.addEventListener('click', () => {
                    card.classList.add('clicked-3d');
                    setTimeout(() => {
                        card.classList.remove('clicked-3d');
                        if (currentTab === 'books') {
                            openBot(`get_books_${sub_id}`);
                        } else {
                            showTeachersModal(sub_id, subjects[sub_id]);
                        }
                    }, 250);
                });

                container.appendChild(card);
            });
        }

        function showTeachersModal(sub_id, sub_name) {
            document.getElementById('modalSubTitle').innerText = `ملازم ${sub_name}`;
            const listContainer = document.getElementById('teachersContainer');
            listContainer.innerHTML = '';

            let teachers = [];
            if (dynamicData.notes && dynamicData.notes[sub_id]) {
                teachers = dynamicData.notes[sub_id].map(item => item.teacher);
            }

            if (teachers.length === 0) {
                listContainer.innerHTML = `<div style="text-align: center; color: var(--text-sub); padding: 15px; font-size: 14px;">لا توجد ملازم مضافة لهذه المادة بعد</div>`;
            } else {
                teachers.forEach((teacherName, index) => {
                    const btn = document.createElement('button');
                    btn.className = 'teacher-btn';
                    btn.innerHTML = `
                        <div class="teacher-info">
                            <div class="teacher-icon-glow">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                            </div>
                            <span>${teacherName}</span>
                        </div>
                        <span class="arrow-icon">←</span>
                    `;
                    btn.onclick = () => {
                        closeModalForce();
                        openBot(`get_notes_${sub_id}_${index}`);
                    };
                    listContainer.appendChild(btn);
                });
            }

            document.getElementById('teachersModal').classList.add('active');
        }

        function closeModal(e) {
            if (e.target.id === 'teachersModal') {
                closeModalForce();
            }
        }

        function closeModalForce() {
            document.getElementById('teachersModal').classList.remove('active');
        }

        function switchTab(tab) {
            currentTab = tab;
            document.getElementById('btn-books').classList.toggle('active', tab === 'books');
            document.getElementById('btn-notes').classList.toggle('active', tab === 'notes');
            renderSubjects();
        }

        function hideToast() {
            const toast = document.getElementById('redirectToast');
            toast.classList.remove('active');
        }

        function openBot(param) {
            const toast = document.getElementById('redirectToast');
            toast.classList.add('active');

            setTimeout(() => {
                const botUsername = "jjswkkskdnobot";
                tg.openTelegramLink(`https://t.me/${botUsername}?start=${param}`);
                setTimeout(hideToast, 500);
            }, 1000);
        }

        window.addEventListener('pageshow', hideToast);
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                hideToast();
            }
        });

        renderSubjects();
        fetchDynamicData();
    </script>
</body>
</html>
